name: isx-base-agent
description: Define and configure the base agent
parent: tpl-minimal
tools:
  - zmx
  - mise
  - pi:
      provider: openai
  - pi-ext
run_as_user:
  - mkdir -p ~/.pi/agent
  - ln -s /etc/claude-code/CLAUDE.md ~/.pi/agent/CLAUDE.md
default-action: pi
skills:
  repo: maxandersen/skills
  list:
    - jreleaser
    - prefer-jbang-automation
